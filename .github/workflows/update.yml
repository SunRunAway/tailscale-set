name: update

on:
  schedule:
    - cron: "56 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: generate
        run: python3 gen.py

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          mv tailscale.list out/
          cd out
          git init -q -b removed
          git add tailscale.list
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm update
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" removed
